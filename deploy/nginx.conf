# Um nginx para os dois apps, separados pelo Host (o túnel da Cloudflare
# manda o hostname público). /api e /socket.io vão para a API.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream api {
  server api:3000;
}

server {
  listen 80 default_server;
  server_name cardapio.devyank.com _;
  root /srv/cliente;
  include /etc/nginx/conf.d/comum.inc;
}

server {
  listen 80;
  server_name cardapio-equipe.devyank.com;
  root /srv/equipe;
  include /etc/nginx/conf.d/comum.inc;
}
