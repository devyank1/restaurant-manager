services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: cardapio
      POSTGRES_PASSWORD: cardapio
      POSTGRES_DB: cardapio
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  pgdata:
